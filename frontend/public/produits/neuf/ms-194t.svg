<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" width="1000" height="750" role="img" aria-label="STIHL MS 194 T — 31,8 cm³ · poignée haute · 3,3 kg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/><stop offset="100%" stop-color="#EFEFF2"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E1000F"/><stop offset="100%" stop-color="#E1000F" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="org" x1="0.1" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#FF9233"/><stop offset="45%" stop-color="#EE7203"/>
      <stop offset="100%" stop-color="#B9550A"/>
    </linearGradient>
    <linearGradient id="orgSoft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFA556"/><stop offset="100%" stop-color="#D96A05"/>
    </linearGradient>
    <linearGradient id="pale" x1="0.1" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#FDFDFD"/><stop offset="50%" stop-color="#DFE2E5"/>
      <stop offset="100%" stop-color="#AFB4B9"/>
    </linearGradient>
    <linearGradient id="dark" x1="0.1" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#4A4E53"/><stop offset="55%" stop-color="#2E3236"/>
      <stop offset="100%" stop-color="#1A1C1F"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EDEFF1"/><stop offset="40%" stop-color="#C2C7CC"/>
      <stop offset="100%" stop-color="#8D9399"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#D8D2C6"/><stop offset="60%" stop-color="#B3AB9C"/>
      <stop offset="100%" stop-color="#8C8576"/>
    </linearGradient>
    <radialGradient id="shade" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#0B0B0C" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0B0B0C" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1000" height="750" fill="url(#bg)"/>
  <rect x="0" y="0" width="1000" height="6" fill="#E1000F"/>

  <!-- Cadrage : le taille-haie est le dessin le plus large (906 px), c'est lui
       qui fixe l'échelle maximale sans déborder de la tuile. -->
  <g transform="translate(35 52) scale(1.06)">
    <ellipse cx="400" cy="372" rx="300" ry="24" fill="url(#shade)"/>
    <!-- poignée arrière -->
    <path d="M44 150 h96 v34 H86 v74 h54 v34 H44 q-18 0 -18 -18 V168 q0 -18 18 -18 z" fill="url(#dark)"/>
    <!-- corps -->
    <path d="M118 140 h176 q30 0 30 30 v122 q0 26 -26 26 H118 q-26 0 -26 -26 V170 q0 -30 26 -30 z" fill="url(#org)"/>
    <!-- capot filtre -->
    <path d="M140 112 h132 q22 0 22 22 v18 H118 v-18 q0 -22 22 -22 z" fill="url(#orgSoft)"/>
    <!-- poignée supérieure -->
    <path d="M128 106 q84 -34 168 -4" fill="none" stroke="url(#dark)" stroke-width="20" stroke-linecap="round"/>
    <!-- grilles d'aération -->
    <path d="M132 196 h58 M132 218 h58 M132 240 h58" stroke="#00000033" stroke-width="7" stroke-linecap="round"/>
    <path d="M236 274 h74 q16 0 16 16 v20 q0 16 -16 16 h-74 z" fill="url(#dark)"/>
    <!-- protège-main / frein de chaîne -->
    <path d="M318 126 q46 6 52 58" fill="none" stroke="url(#dark)" stroke-width="18" stroke-linecap="round"/>
    <!-- guide-chaîne -->
    <path d="M352 196 H543 q34 0 34 26 t-34 26 H352 z" fill="url(#steel)"/>
    <path d="M366 212 H537 q16 0 16 10 t-16 10 H366 z" fill="#00000018"/>
    <circle cx="547" cy="222" r="13" fill="none" stroke="#7E848A" stroke-width="5"/>
    <path d="M362 196 l9 -9 h7 l-4 9 z" fill="#4E5459"/><path d="M375 248 l9 9 h7 l-4 -9 z" fill="#4E5459"/><path d="M388 196 l9 -9 h7 l-4 9 z" fill="#4E5459"/><path d="M401 248 l9 9 h7 l-4 -9 z" fill="#4E5459"/><path d="M414 196 l9 -9 h7 l-4 9 z" fill="#4E5459"/><path d="M427 248 l9 9 h7 l-4 -9 z" fill="#4E5459"/><path d="M440 196 l9 -9 h7 l-4 9 z" fill="#4E5459"/><path d="M453 248 l9 9 h7 l-4 -9 z" fill="#4E5459"/><path d="M466 196 l9 -9 h7 l-4 9 z" fill="#4E5459"/><path d="M479 248 l9 9 h7 l-4 -9 z" fill="#4E5459"/><path d="M492 196 l9 -9 h7 l-4 9 z" fill="#4E5459"/><path d="M505 248 l9 9 h7 l-4 -9 z" fill="#4E5459"/><path d="M518 196 l9 -9 h7 l-4 9 z" fill="#4E5459"/><path d="M531 248 l9 9 h7 l-4 -9 z" fill="#4E5459"/><path d="M544 196 l9 -9 h7 l-4 9 z" fill="#4E5459"/><path d="M557 248 l9 9 h7 l-4 -9 z" fill="#4E5459"/>
    <!-- carter de pignon -->
    <path d="M300 168 h56 q18 0 18 18 v72 q0 18 -18 18 h-56 z" fill="url(#orgSoft)"/>
    <circle cx="332" cy="222" r="9" fill="#00000040"/>
  </g>

  <rect x="80" y="576" width="420" height="3" fill="url(#rule)"/>

  <text x="80" y="552" font-family="Inter, Roboto, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" letter-spacing="4.5" fill="#E1000F">STIHL</text>
  <text x="80" y="636" font-family="Inter, Roboto, Helvetica, Arial, sans-serif" font-size="54" font-weight="800" letter-spacing="-1" fill="#0B0B0C">MS 194 T</text>
  <text x="80" y="682" font-family="Inter, Roboto, Helvetica, Arial, sans-serif" font-size="23" font-weight="600" fill="#74777E">31,8 cm³ · poignée haute · 3,3 kg</text>

  <text x="820" y="682" text-anchor="end" font-family="Inter, Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="3" fill="#A3A5AB">VOLTARIS</text>
</svg>
